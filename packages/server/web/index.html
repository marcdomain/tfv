<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>teriac server</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="signed-out">
  <div class="shell">
    <aside class="side" aria-label="teriac server">
      <a class="brand" href="#overview"><svg class="logo" viewBox="0 0 250 64" role="img" aria-label="teriac"><path d="M32 6 L54 18.5 L32 31 L10 18.5 Z" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M10 26 L32 38.5 L32 59 L10 46.5 Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/><path d="M54 26 L32 38.5 L32 59 L54 46.5 Z" fill="var(--accent)" fill-opacity="0.7"/><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M86 13 V41 Q86 51 96 51"/><path d="M78 25 H96"/><path d="M106 38 H131 A13 13 0 1 0 127 48"/><path d="M143 51 V25"/><path d="M143 36 Q145 25 158 26"/><path d="M168 51 V25"/><path d="M168 13 v0.01"/><path d="M204 25 V51"/><path d="M204 38 A13 13 0 1 0 204 38.01"/><path d="M240 30 A13 13 0 1 0 240 46"/></g></svg><span class="product">server</span></a>
      <nav id="nav" aria-label="Sections">
        <a href="#overview" data-view="overview"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span>Overview</span></a>
        <a href="#runs" data-view="runs"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z"/></svg><span>Runs</span></a>
        <a href="#projects" data-view="projects"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5c0-.6.4-1 1-1h3.2l1.3 1.5H13c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/></svg><span>Projects</span></a>
        <a href="#locks" data-view="locks"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg><span>Locks</span></a>
        <a href="#drift" data-view="drift"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 6c2-2 3.5 2 6.5 0s4.5 2 6.5 0M1.5 10.5c2-2 3.5 2 6.5 0s4.5 2 6.5 0"/></svg><span>Drift</span></a>
        <a href="#audit" data-view="audit"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13 4v3.6c0 3-2.2 5.6-5 6.6-2.8-1-5-3.6-5-6.6V4z"/><path d="m5.8 8 1.6 1.6L10.4 6.6"/></svg><span>Audit</span></a>
        <a href="#guardrails" data-view="guardrails"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 13 4v3.6c0 3-2.2 5.6-5 6.6-2.8-1-5-3.6-5-6.6V4z"/><path d="M5.5 8h5"/></svg><span>Guardrails</span></a>
        <a href="#access" data-view="access"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="8" r="2.8"/><path d="M8.3 8H14M12 8v2.3M14 8v1.6"/></svg><span>Access</span></a>
        <a href="#metrics" data-view="metrics"><svg class="ni" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11"/><path d="M4.5 11V8M8 11V4M11.5 11V6.5"/></svg><span>Metrics</span></a>
      </nav>
      <div class="side-foot">
        <span id="connected" class="connected small" hidden></span>
        <div id="me" class="me" hidden></div>
        <div class="side-actions">
          <button id="theme" class="ghost small icon" type="button" title="Theme"></button>
          <button id="signout" class="ghost small" type="button" hidden>Sign out</button>
        </div>
      </div>
    </aside>

    <div class="content">
      <main id="main">
        <section id="signin" class="signin" hidden>
          <h1>Sign in to teriac server</h1>
          <p id="signin-error" class="error" role="alert" hidden></p>
          <a id="sso" class="button sso" href="/auth/oidc/login" hidden></a>
          <div id="or" class="or" hidden><span>or</span></div>
          <form id="password-form" hidden>
            <label for="username">Username</label>
            <input id="username" autocomplete="username" spellcheck="false" required>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
          </form>
          <details id="token-box" hidden>
            <summary>Use an API token</summary>
            <form id="token-form">
              <label for="token">API token (<code>TERIAC_API_TOKEN</code>)</label>
              <input id="token" type="password" autocomplete="off" spellcheck="false" required>
              <button type="submit" class="ghost">Sign in with token</button>
            </form>
          </details>
          <p id="no-auth" class="muted" hidden>No sign-in method is set up. Configure single sign-on (<code>TERIAC_OIDC_*</code>), dashboard users, or <code>TERIAC_API_TOKEN</code>.</p>
        </section>
        <section id="view"></section>
      </main>
      <footer class="foot">
        <span><b>teriac server</b> <span id="version" class="mono"></span></span>
        <span id="refreshed"></span>
        <span class="foot-links"><a href="/metrics" target="_blank" rel="noopener">Prometheus metrics</a><a href="/healthz" target="_blank" rel="noopener">Health</a></span>
      </footer>
    </div>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal">
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button value="cancel" class="ghost" type="submit">Cancel</button>
        <button id="modal-ok" value="ok" type="submit"></button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
