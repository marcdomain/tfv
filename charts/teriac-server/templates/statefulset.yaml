{{- include "teriac.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "teriac.fullname" . }}
  labels:
    {{- include "teriac.labels" . | nindent 4 }}
spec:
  # One replica: state (locks, runs) lives in SQLite on the volume.
  replicas: 1
  serviceName: {{ include "teriac.fullname" . }}
  selector:
    matchLabels:
      {{- include "teriac.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "teriac.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/dashboard: {{ toJson .Values.dashboard | sha256sum }}
        {{- if not .Values.github.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "teriac.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: teriac-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TERIAC_PORT
              value: "8080"
            - name: TERIAC_DATA_DIR
              value: /data
            - name: HOME
              value: /home/teriac
            - name: TERIAC_GITHUB_APP_ID
              value: {{ .Values.github.appId | quote }}
            {{- with .Values.github.apiUrl }}
            - name: TERIAC_GITHUB_API_URL
              value: {{ . | quote }}
            {{- end }}
            - name: TERIAC_GITHUB_PRIVATE_KEY_FILE
              value: /secrets/github/private-key
            - name: TERIAC_GITHUB_WEBHOOK_SECRET_FILE
              value: /secrets/github/webhook-secret
            {{- with .Values.config.repoAllowlist }}
            - name: TERIAC_REPO_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.repos }}
            - name: TERIAC_REPOS_CONFIG
              value: /config/repos.yaml
            {{- end }}
            - name: TERIAC_REQUIRE_APPLY_PROJECT
              value: {{ .Values.config.requireApplyProject | quote }}
            - name: TERIAC_ACK_REACTION
              value: {{ .Values.config.ackReaction | default "eyes" | quote }}
            - name: TERIAC_PROGRESS_REPLY
              value: {{ .Values.config.progressReply | quote }}
            - name: TERIAC_COMMENT_MODE
              value: {{ .Values.config.commentMode | default "new" | quote }}
            - name: TERIAC_PARALLELISM
              value: {{ .Values.config.parallelism | quote }}
            {{- with .Values.config.prParallelism }}
            - name: TERIAC_PR_PARALLELISM
              value: {{ . | quote }}
            {{- end }}
            - name: TERIAC_RUN_TIMEOUT_SECONDS
              value: {{ .Values.config.runTimeoutSeconds | quote }}
            - name: TERIAC_DEFAULT_VERSION
              value: {{ .Values.config.defaultVersion | quote }}
            - name: TERIAC_DRIFT
              value: {{ .Values.config.drift | quote }}
            - name: TERIAC_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: TERIAC_VERIFY_SIGNATURES
              value: {{ .Values.config.verifySignatures | quote }}
            {{- if .Values.backup.enabled }}
            {{- $type := include "teriac.backupType" . }}
            {{- $sec := index .Values.backup.backend $type }}
            - name: TERIAC_BACKUP_ENABLED
              value: "true"
            - name: TERIAC_BACKUP_SCHEDULE
              value: {{ .Values.backup.schedule | quote }}
            - name: TERIAC_BACKUP_TIMEZONE
              value: {{ .Values.backup.timezone | default "UTC" | quote }}
            {{- with .Values.backup.notify }}
            - name: TERIAC_BACKUP_NOTIFY
              value: {{ join "," . | quote }}
            {{- end }}
            - name: TERIAC_BACKUP_BACKEND
              value: {{ $type | quote }}
            - name: TERIAC_BACKUP_BUCKET
              value: {{ ternary $sec.container $sec.bucket (eq $type "azure") | quote }}
            - name: TERIAC_BACKUP_PATH
              value: {{ $sec.path | default (printf "teriac/%s/%s" .Release.Namespace .Release.Name) | quote }}
            {{- if eq $type "s3" }}
            {{- with $sec.region }}
            - name: TERIAC_BACKUP_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with $sec.endpoint }}
            - name: TERIAC_BACKUP_S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $sec.storageClass }}
            - name: TERIAC_BACKUP_S3_STORAGE_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $type "azure" }}
            - name: TERIAC_BACKUP_AZURE_ACCOUNT
              value: {{ $sec.accountName | quote }}
            {{- end }}
            {{- with .Values.backup.backend.existingSecret }}
            {{- if eq $type "s3" }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: access-key-id }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: secret-access-key }
            {{- else if eq $type "azure" }}
            - name: TERIAC_BACKUP_AZURE_KEY
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: account-key }
            {{- else }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/backup/credentials.json
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.config.preinstall }}
            - name: TERIAC_PREINSTALL
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with (include "teriac.publicUrl" .) }}
            - name: TERIAC_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.dashboard.apiToken.existingSecret }}
            - name: TERIAC_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: api-token
            {{- end }}
            - name: TERIAC_SESSION_SECRET_FILE
              value: /secrets/session/session-secret
            - name: TERIAC_SESSION_HOURS
              value: {{ .Values.dashboard.sessionHours | quote }}
            {{- if or .Values.dashboard.users .Values.dashboard.usersExistingSecret }}
            - name: TERIAC_DASHBOARD_USERS_FILE
              value: /secrets/users/users.yaml
            {{- end }}
            {{- with .Values.dashboard.oidc }}
            {{- if .enabled }}
            - name: TERIAC_OIDC_ISSUER
              value: {{ .issuer | quote }}
            - name: TERIAC_OIDC_CLIENT_ID
              value: {{ .clientId | quote }}
            - name: TERIAC_OIDC_CLIENT_SECRET_FILE
              value: /secrets/oidc/client-secret
            - name: TERIAC_OIDC_NAME
              value: {{ .name | quote }}
            - name: TERIAC_OIDC_SCOPES
              value: {{ join "," .scopes | quote }}
            - name: TERIAC_OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            - name: TERIAC_OIDC_ADMIN_GROUPS
              value: {{ join "," .adminGroups | quote }}
            - name: TERIAC_OIDC_ALLOWED_GROUPS
              value: {{ join "," .allowedGroups | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: github
              mountPath: /secrets/github
              readOnly: true
            - name: session
              mountPath: /secrets/session
              readOnly: true
            {{- if or .Values.dashboard.users .Values.dashboard.usersExistingSecret }}
            - name: users
              mountPath: /secrets/users
              readOnly: true
            {{- end }}
            {{- if .Values.dashboard.oidc.enabled }}
            - name: oidc
              mountPath: /secrets/oidc
              readOnly: true
            {{- end }}
            {{- if .Values.repos }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- end }}
            # Writable scratch space with a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/teriac
            {{- if and .Values.backup.enabled .Values.backup.backend.existingSecret (eq (include "teriac.backupType" .) "gcs") }}
            - name: backup-credentials
              mountPath: /secrets/backup
              readOnly: true
            {{- end }}
      volumes:
        - name: github
          secret:
            secretName: {{ include "teriac.githubSecretName" . }}
            defaultMode: 0440
        - name: session
          secret:
            secretName: {{ default (include "teriac.authSecretName" .) .Values.dashboard.sessionSecret.existingSecret }}
            items: [{ key: session-secret, path: session-secret }]
            defaultMode: 0440
        {{- if or .Values.dashboard.users .Values.dashboard.usersExistingSecret }}
        - name: users
          secret:
            secretName: {{ default (include "teriac.authSecretName" .) .Values.dashboard.usersExistingSecret }}
            items: [{ key: users.yaml, path: users.yaml }]
            defaultMode: 0440
        {{- end }}
        {{- if .Values.dashboard.oidc.enabled }}
        - name: oidc
          secret:
            secretName: {{ default (include "teriac.authSecretName" .) .Values.dashboard.oidc.existingSecret }}
            items: [{ key: client-secret, path: client-secret }]
            defaultMode: 0440
        {{- end }}
        {{- if .Values.repos }}
        - name: config
          configMap:
            name: {{ include "teriac.fullname" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- if and .Values.backup.enabled .Values.backup.backend.existingSecret (eq (include "teriac.backupType" .) "gcs") }}
        - name: backup-credentials
          secret:
            secretName: {{ .Values.backup.backend.existingSecret }}
            items: [{ key: credentials.json, path: credentials.json }]
            defaultMode: 0440
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "teriac.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
