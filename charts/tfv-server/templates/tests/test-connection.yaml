apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tfv.fullname" . }}-test
  labels:
    {{- include "tfv.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command:
        - node
        - -e
        - >-
          fetch('http://{{ include "tfv.fullname" . }}:{{ .Values.service.port }}/readyz')
          .then(r => { console.log('readyz', r.status); process.exit(r.ok ? 0 : 1) })
          .catch(e => { console.error(e.message); process.exit(1) })
