{{- /* Dashboard secrets the chart manages: session key, inline OIDC secret, inline users. */ -}}
{{- $name := include "tfv.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $session := "" -}}
{{- if and $existing $existing.data (index $existing.data "session-secret") -}}
{{- $session = index $existing.data "session-secret" | b64dec -}}
{{- else -}}
{{- $session = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tfv.labels" . | nindent 4 }}
  annotations:
    # Keep the generated session key when the release is upgraded or deleted.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.dashboard.sessionSecret.existingSecret }}
  session-secret: {{ $session | quote }}
  {{- end }}
  {{- if and .Values.dashboard.oidc.enabled .Values.dashboard.oidc.clientSecret (not .Values.dashboard.oidc.existingSecret) }}
  client-secret: {{ .Values.dashboard.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.dashboard.users }}
  users.yaml: |
    {{- toYaml .Values.dashboard.users | nindent 4 }}
  {{- end }}
