{{- if not .Values.github.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tfv.githubSecretName" . }}
  labels:
    {{- include "tfv.labels" . | nindent 4 }}
type: Opaque
stringData:
  private-key: {{ .Values.github.privateKey | quote }}
  webhook-secret: {{ .Values.github.webhookSecret | quote }}
{{- end }}
