# tfv-server Helm values. Everything here maps to the server's env vars or repos.yaml.

image:
  repository: ghcr.io/marcdomain/tfv-server
  tag: ""                       # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

github:
  appId: ""                     # required
  apiUrl: ""                    # GitHub Enterprise Server, e.g. https://ghe.acme.com/api/v3
  # Use an existing Secret with keys `private-key` and `webhook-secret`...
  existingSecret: ""
  # ...or let the chart create one (avoid committing these to git).
  privateKey: ""
  webhookSecret: ""

config:
  repoAllowlist: []             # e.g. ["github.com/acme/*"]; or list repos in `repos` below
  requireApplyProject: false    # true: no bare `tfv apply`, one project at a time with -p
  ackReaction: eyes             # reaction on a command tfv picked up: eyes, rocket, +1, heart, hooray, laugh, confused, -1, none
  progressReply: false          # true: a spinning "Running…" reply that is edited into the result (needs a public https URL)
  commentMode: new              # new: a new comment per plan/apply; update: one comment at the top, edited in place
  parallelism: 4                # plans/applies at once, across all PRs
  prParallelism: ""             # one PR's share (default: parallelism - 1)
  runTimeoutSeconds: 3600
  defaultVersion: latest        # tool version when a project pins none
  preinstall: []                # e.g. ["terraform@1.9.8", "tofu@1.8.5", "terragrunt@0.83.2"]
  drift: true                   # run drift schedules
  publicUrl: ""                 # defaults to the first ingress host
  logLevel: info

# Contents of repos.yaml: rules, approvers, channels, people, drift schedules.
# See packages/server/README.md. Mounted at /config/repos.yaml.
repos: {}
#  channels:
#    infra-alerts: { type: slack, channel: "#infra-drift", token_env: TFV_SLACK_TOKEN }
#  repos:
#    - id: github.com/acme/*
#      require_apply_project: true
#      allow_state_changes: true          # false: no import/taint/state rm/state mv/force-unlock from PRs
#      projects:
#        - match: prod/**
#          permissions:
#            apply: [team:platform-admins]
#            apply_destroy: [admin]
#            state_read: [team:platform-admins]   # state show, show, output
#            state_remove: [admin]                # state rm, state mv, force-unlock
#            force_unlock: []                     # single commands can be set too; [] = nobody
#          approvals: [{ from: team:platform-admins, count: 2 }]

dashboard:
  # Sign-in methods; turn on any mix. Viewers read, admins can unlock and run drift checks.
  oidc:                         # Okta, Azure AD, Google, Keycloak, Auth0...
    enabled: false
    name: Okta                  # button label
    issuer: ""                  # e.g. https://acme.okta.com/oauth2/default
    clientId: ""
    existingSecret: ""          # Secret with key `client-secret`
    clientSecret: ""            # or inline (the chart creates a Secret)
    scopes: [openid, profile, email, groups]
    groupsClaim: groups
    adminGroups: []             # e.g. [tfv-admins]
    allowedGroups: []           # if set, only these groups (and admins) may sign in
  # Username/password users. Hash with: node packages/server/src/hash-password.ts
  users: []
  #  - { username: ada, password_hash: "scrypt$16384$8$1$...", role: admin, name: Ada Lovelace }
  usersExistingSecret: ""       # or a Secret with key `users.yaml` holding that list
  apiToken:
    existingSecret: ""          # Secret with key `api-token`: automation and /api access
  sessionHours: 12
  # Signs session cookies. Left empty, the chart generates one and keeps it across upgrades.
  sessionSecret:
    existingSecret: ""          # Secret with key `session-secret` (32+ characters)

# Cloud credentials, chat tokens (TFV_SLACK_TOKEN, TFV_TEAMS_WEBHOOK), etc.
extraEnv: []
#  - name: AWS_REGION
#    value: eu-central-1
extraEnvFrom: []
#  - secretRef:
#      name: tfv-chat-tokens

persistence:
  enabled: true
  size: 20Gi                    # checkouts, saved plans, tool binaries, provider cache, database
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

# Gateway API (recommended): an HTTPRoute attached to your Gateway.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: public-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []                 # e.g. [tfv.acme.dev]
  # Default sends everything to tfv. To expose only webhooks on a public gateway,
  # use: [{ matches: [{ path: { type: PathPrefix, value: /events/ } }] }]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }

# Classic Ingress, if you still use one.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tfv.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}               # e.g. eks.amazonaws.com/role-arn for IRSA

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Give running plans and applies time to finish on upgrades and node drains.
terminationGracePeriodSeconds: 3600

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the server (your ingress controller, Prometheus).
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
