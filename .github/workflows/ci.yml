name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Skip our own postinstall here; the smoke test below runs it on purpose.
      - run: npm ci --ignore-scripts

      - run: npm test

      - name: Smoke test install setup and CLI
        shell: bash
        run: |
          node lib/utils/postInstall.js
          test -f "$HOME/.tfv/.setup"
          node index.js --help > /dev/null
          node index.js auto-switch --help > /dev/null

      - name: Check shell hooks parse (bash / zsh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node index.js shell-init bash > hook.bash && bash -n hook.bash
          if command -v zsh > /dev/null; then node index.js shell-init zsh > hook.zsh && zsh -n hook.zsh; fi

      - name: Check shell hook parses (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hook = node index.js shell-init powershell | Out-String
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($hook, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  server:
    name: tfv-server / node 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck --workspace tfv-server

      - name: Test
        run: npm test --workspace tfv-server

  server-image:
    name: tfv-server image, e2e and Helm on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint charts/tfv-server --set github.appId=1 --set github.existingSecret=s --set 'config.repoAllowlist={github.com/acme/*}'
          # Missing required values must fail with a clear message.
          if helm template t charts/tfv-server > /dev/null 2> err.txt; then echo "expected a failure"; exit 1; fi
          grep -q 'github.appId is required' err.txt

      - name: Build image
        run: docker build -t tfv-server:ci .

      - name: End-to-end (mock GitHub, real git and terraform)
        run: packages/server/e2e/run.sh tfv-server:ci

      - uses: helm/kind-action@v1
        with:
          cluster_name: tfv-ci

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install chart (Gateway API route, dashboard user) and run helm test
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
          kind load docker-image tfv-server:ci --name tfv-ci
          openssl genrsa -out app.pem 2048
          HASH=$(printf 'ci-admin-password' | node packages/server/src/hash-password.ts)
          helm install tfv charts/tfv-server -n tfv --create-namespace --wait --timeout 3m \
            --set image.repository=tfv-server --set image.tag=ci --set image.pullPolicy=Never \
            --set github.appId=1 --set-file github.privateKey=app.pem --set github.webhookSecret=ci \
            --set 'config.repoAllowlist={github.com/acme/*}' --set config.requireApplyProject=true \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gw' --set 'httpRoute.hostnames[0]=tfv.ci.test' \
            --set-json "dashboard.users=[{\"username\":\"ci\",\"password_hash\":\"$HASH\",\"role\":\"admin\"}]" \
            --set persistence.size=1Gi --set terminationGracePeriodSeconds=30
          helm test tfv -n tfv
          kubectl -n tfv get httproute tfv-tfv-server
          kubectl -n tfv port-forward svc/tfv-tfv-server 8080:80 & sleep 3
          curl -sf -X POST localhost:8080/auth/login -H 'X-Requested-With: tfv' -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-admin-password"}' | grep -q '"role":"admin"'
          kubectl -n tfv logs statefulset/tfv-tfv-server | tail -20

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Package stays small and has no stray files
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const [p] = require('./pack.json');
            const bad = p.files.map(f => f.path).filter(f => !/^(index\.js|package\.json|README\.md|LICENSE|lib\/)/.test(f));
            console.log('size', p.size, 'bytes,', p.files.length, 'files');
            if (bad.length) { console.error('unexpected files:', bad); process.exit(1); }
            if (p.size > 200000) { console.error('package over 200 kB'); process.exit(1); }
          "
